name: Sync Google Sheet

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub may run it a few minutes late)
  workflow_dispatch: {}       # "Run workflow" button for an instant sync

permissions:
  contents: write

concurrency:
  group: sync-sheet
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Copy sheet tabs into data/
        run: |
          pip install --quiet openpyxl
          python3 scripts/sync_sheet.py
      - name: Commit if the sheet changed
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "rpc-tracker-sync"
            git config user.email "actions@users.noreply.github.com"
            git add data
            git commit -m "Sync Google Sheet data"
            git push
          else
            echo "Sheet unchanged"
          fi
